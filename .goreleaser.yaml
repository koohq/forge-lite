version: 2
project_name: forge-lite

builds:
  - main: .
    binary: forge-lite
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.ja.md
      - LICENSE
      - custom_theme.example.json

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
