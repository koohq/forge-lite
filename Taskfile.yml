version: '3'

tasks:
  run:
    desc: "Run the CLI roguelite game"
    cmd: go run .
    interactive: true

  build:
    desc: "Build the game binary for current platform"
    cmds:
      - mkdir -p bin
      - go build -o bin/forge-lite{{exeExt}} .

  build:all:
    desc: "Cross-compile game binaries for Windows, Linux, and macOS"
    cmds:
      - mkdir -p bin
      - cmd: go build -o bin/forge-lite-windows-amd64.exe .
        env:
          GOOS: windows
          GOARCH: amd64
      - cmd: go build -o bin/forge-lite-linux-amd64 .
        env:
          GOOS: linux
          GOARCH: amd64
      - cmd: go build -o bin/forge-lite-darwin-arm64 .
        env:
          GOOS: darwin
          GOARCH: arm64

  clean:
    desc: "Remove build outputs"
    cmds:
      - rm -rf bin

  test:
    desc: "Run all unit tests"
    cmd: go test -v ./...
