version: '3'

tasks:
  run:
    desc: "Run the CLI roguelite game"
    cmd: go run ./cmd/game
    interactive: true

  build:
    desc: "Build the game binary for current platform"
    cmds:
      - cmd: powershell -Command "if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin | Out-Null }"
        platforms: [windows]
      - cmd: mkdir -p bin
        platforms: [linux, darwin]
      - go build -o bin/game{{exeExt}} ./cmd/game

  build:all:
    desc: "Cross-compile game binaries for Windows, Linux, and macOS"
    cmds:
      - cmd: powershell -Command "if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin | Out-Null }"
        platforms: [windows]
      - cmd: mkdir -p bin
        platforms: [linux, darwin]
      - cmd: go build -o bin/game-windows-amd64.exe ./cmd/game
        env:
          GOOS: windows
          GOARCH: amd64
      - cmd: go build -o bin/game-linux-amd64 ./cmd/game
        env:
          GOOS: linux
          GOARCH: amd64
      - cmd: go build -o bin/game-darwin-arm64 ./cmd/game
        env:
          GOOS: darwin
          GOARCH: arm64

  clean:
    desc: "Remove build outputs"
    cmds:
      - cmd: powershell -Command "if (Test-Path bin) { Remove-Item -Recurse -Force bin }"
        platforms: [windows]
      - cmd: rm -rf bin
        platforms: [linux, darwin]

  test:
    desc: "Run all unit tests"
    cmd: go test -v ./...
