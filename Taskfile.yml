version: '3'

tasks:
  run:
    desc: "Run the CLI roguelite game"
    cmd: go run .
    interactive: true

  build:
    desc: "Build the game binary for current platform"
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/forge-lite{{exeExt}} .

  release:
    desc: "Snapshot build all release binaries using GoReleaser"
    cmd: goreleaser build --snapshot --clean

  clean:
    desc: "Remove build outputs"
    cmds:
      - rm -rf bin dist

  test:
    desc: "Run all unit tests"
    cmd: go test -v ./...
